<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">
  <!-- スマートフォンなどの画面幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tangsten | Portfolio</title>

  <style>
    /* =========================================
       全体の基本設定（おしゃれな喫茶店風の配色とフォント）
    ========================================= */
    :root {
      --bg-color: #f7f3eb;       /* 背景色：生成り・ミルクベージュ */
      --card-bg: #fffdf9;        /* カード背景：少し明るいクリーム色 */
      --text-main: #4a3f35;      /* メイン文字色：濃いコーヒーブラウン */
      --text-sub: #7d6e60;       /* サブ文字色：カフェオレブラウン */
      --accent-green: #8da399;   /* アクセント1：淡いセージグリーン */
      --accent-pink: #d4a39a;    /* アクセント2：くすみピンク */
      --border-color: #e3d8c8;   /* 枠線の色：淡いラテカラー */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      /* 喫茶店の雰囲気に合う明朝体ベースのフォント指定 */
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      color: var(--text-main);
      line-height: 1.8;
      padding: 20px 15px;
    }

    /* =========================================
       メインコンテナ（中央寄せ・最大幅制限）
    ========================================= */
    .container {
      max-width: 720px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 8px 24px rgba(74, 63, 53, 0.06);
    }

    /* =========================================
       ヘッダーエリア（名前とキャッチコピー）
    ========================================= */
    header {
      text-align: center;
      padding-bottom: 30px;
      margin-bottom: 35px;
      border-bottom: 2px dashed var(--border-color);
    }

    /* 喫茶店の看板風ラベル */
    .cafe-label {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      padding: 2px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      background-color: var(--bg-color);
    }

    /* 名前（ニックネーム） */
    h1 {
      font-size: 2.4rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    /* ひとことキャッチコピー */
    .catchphrase {
      display: inline-block;
      font-size: 1.05rem;
      color: var(--text-sub);
      background: linear-gradient(transparent 60%, #e9dfd1 60%);
      padding: 0 8px;
    }

    /* =========================================
       各セクションの共通デザイン（メニュー表風）
    ========================================= */
    section {
      margin-bottom: 35px;
    }

    section:last-of-type {
      margin-bottom: 0;
    }

    /* セクション見出し */
    h2 {
      font-size: 1.25rem;
      font-weight: normal;
      color: var(--text-main);
      border-left: 4px solid var(--accent-green);
      padding-left: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 見出し横の英語装飾 */
    h2 span {
      font-size: 0.75rem;
      color: var(--text-sub);
      letter-spacing: 0.1em;
    }

    /* =========================================
       基本情報リスト
    ========================================= */
    .profile-list {
      list-style: none;
      background-color: var(--bg-color);
      border-radius: 8px;
      padding: 18px 22px;
    }

    .profile-list li {
      display: flex;
      border-bottom: 1px dotted var(--border-color);
      padding: 8px 0;
    }

    .profile-list li:last-child {
      border-bottom: none;
    }

    .profile-term {
      width: 110px;
      font-weight: bold;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    /* =========================================
       趣味・プログラミング経験（タグ風バッジ）
    ========================================= */
    .tag-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag-list li {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    /* プログラミング経験側のタグ色分け */
    .skill-list li {
      border-color: var(--accent-green);
      background-color: #f2f5f3;
    }

    /* =========================================
       この授業で学びたいこと（テキストボックス風）
    ========================================= */
    .goal-box {
      background-color: var(--bg-color);
      border-radius: 8px;
      padding: 18px 22px;
      border: 1px solid var(--border-color);
    }

    /* =========================================
       ひとこと（コースター・メッセージカード風）
    ========================================= */
    .message-box {
      text-align: center;
      background-color: #faf3f1;
      border: 1px dashed var(--accent-pink);
      border-radius: 8px;
      padding: 20px;
      margin-top: 10px;
    }

    .message-box p {
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      color: var(--text-main);
    }

    /* =========================================
       フッター
    ========================================= */
    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* =========================================
       スマートフォン向けのレスポンシブ調整
    ========================================= */
    @media (max-width: 600px) {
      .container {
        padding: 28px 20px;
      }

      h1 {
        font-size: 1.9rem;
      }

      h2 {
        font-size: 1.1rem;
      }

      .profile-list li {
        flex-direction: column;
        gap: 2px;
      }

      .profile-term {
        width: auto;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- ページ全体の枠組み -->
  <div class="container">

    <!-- ヘッダー：名前とひとことキャッチコピー -->
    <header>
      <div class="cafe-label">PORTFOLIO</div>
      <h1>Tangsten</h1>
      <p class="catchphrase">冷凍うどんは楽</p>
    </header>

    <main>
      <!-- 基本情報セクション -->
      <section>
        <h2>基本情報 <span>PROFILE</span></h2>
        <ul class="profile-list">
          <li>
            <span class="profile-term">名前</span>
            <span>Tangsten</span>
          </li>
          <li>
            <span class="profile-term">学年</span>
            <span>3</span>
          </li>
          <li>
            <span class="profile-term">所属</span>
            <span>拓殖大学工学部情報工学科</span>
          </li>
        </ul>
      </section>

      <!-- 趣味・好きなことセクション -->
      <section>
        <h2>趣味・好きなこと <span>HOBBIES</span></h2>
        <ul class="tag-list">
          <li>ゲーム</li>
          <li>スキー</li>
          <li>楽器</li>
        </ul>
      </section>

      <!-- プログラミング経験セクション -->
      <section>
        <h2>プログラミング経験 <span>PROGRAMMING</span></h2>
        <ul class="tag-list skill-list">
          <li>Java</li>
          <li>Python</li>
          <li>HTML / CSS / JavaScript</li>
        </ul>
      </section>

      <!-- この授業で学びたいことセクション -->
      <section>
        <h2>この授業で学びたいこと <span>GOAL</span></h2>
        <div class="goal-box">
          <p>OSSの起源やその仕組み、使い方等を学ぶこと</p>
        </div>
      </section>

      <!-- ひとことセクション -->
      <section>
        <h2>ひとこと <span>MESSAGE</span></h2>
        <div class="message-box">
          <p>聖杯よこせ</p>
        </div>
      </section>
    </main>

  </div>

  <!-- フッター -->
  <footer>
    <p>© Tangsten</p>
  </footer>

</body>
</html>
